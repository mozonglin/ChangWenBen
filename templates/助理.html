<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 餐饮助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: '#333333',
secondary: '#1E1E1E'
},
borderRadius: {
'none': '0px',
'sm': '8px',
DEFAULT: '12px',
'md': '16px',
'lg': '20px',
'xl': '24px',
'2xl': '28px',
'3xl': '32px',
'full': '9999px',
'button': '12px'
}
}
}
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/highlight.min.js"></script>
<style>
/* 自定义滚动条 */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: #1E1E1E;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb {
  background: #4A4A4A;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #555;
}

/* 消息动画效果 */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.typing-message, .user-message {
  animation: fadeIn 0.3s ease-out forwards;
}

/* 打字机光标 */
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 16px;
  background-color: white;
  animation: blink 1s infinite;
  vertical-align: middle;
  margin-left: 2px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* 对话气泡美化 */
.user-bubble {
  background: linear-gradient(135deg, #9333EA 0%, #6366F1 100%);
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.ai-bubble {
  background: linear-gradient(135deg, #1E1E1E 0%, #2A2A2A 100%);
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  border-bottom-left-radius: 4px;
  border-bottom-right-radius: 12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* 历史对话项目悬停效果 */
.conversation-item {
  transition: all 0.2s ease;
  position: relative;
}

.conversation-item:hover::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 4px;
  background: linear-gradient(to bottom, #9333EA, #6366F1);
  border-radius: 2px;
}

/* 深度思考按钮激活样式 */
.deep-thinking-active {
  background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
  box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
}

/* 图片上传预览 */
.image-preview {
  transition: transform 0.2s ease;
}

.image-preview:hover {
  transform: scale(1.05);
}

/* 可点击元素悬停效果 */
.hover-effect {
  transition: all 0.2s ease;
}

.hover-effect:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

/* 消息发送按钮动画 */
.send-button {
  transition: all 0.2s ease;
}

.send-button:hover {
  transform: scale(1.1);
  background-color: #6366F1;
}

/* 输入框样式 */
.message-input:focus {
  box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
  outline: none;
}

/* 状态消息样式 */
#statusMessage {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
    max-width: 80%;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    transition: opacity 0.3s ease;
    white-space: pre-line;
}

.status-error {
    background-color: #ffebee;
    color: #d32f2f;
    border-left: 4px solid #d32f2f;
}

.status-success {
    background-color: #e8f5e9;
    color: #2e7d32;
    border-left: 4px solid #2e7d32;
}

.status-processing, .status-uploading {
    background-color: #e3f2fd;
    color: #1976d2;
    border-left: 4px solid #1976d2;
}

/* 打字指示器样式 */
.typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
}

.typing-indicator span {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #999;
    animation: bounce 1.4s infinite ease-in-out;
}

.typing-indicator span:nth-child(1) {
    animation-delay: 0s;
}

.typing-indicator span:nth-child(2) {
    animation-delay: 0.2s;
}

.typing-indicator span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes bounce {
    0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
    }
    40% {
        transform: scale(1);
        opacity: 1;
    }
}

/* 复制按钮样式 */
.copy-button {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 4px;
    background-color: #2a2a2a;
    color: #ddd;
    border: 1px solid #444;
    cursor: pointer;
    font-size: 12px;
    margin-top: 8px;
    transition: all 0.2s ease;
}

.copy-button:hover {
    background-color: #3a3a3a;
    color: #fff;
}

.copy-button i {
    font-size: 14px;
}

/* 消息样式 */
.message {
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease-out forwards;
}

.message-content {
    max-width: 85%;
    border-radius: 8px;
    padding: 12px;
    word-break: break-word;
}

.user-message {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.user-message .message-content {
    background: linear-gradient(135deg, #9333EA 0%, #6366F1 100%);
    color: white;
}

.ai-message {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 8px;
}

.ai-avatar {
    flex-shrink: 0;
    margin-top: 4px;
}

.ai-message .message-content {
    background-color: #2A2A2A;
}

.message-timestamp {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
}

.text-content {
    line-height: 1.5;
}

.uploaded-image {
    max-width: 100%;
    max-height: 300px;
    border-radius: 4px;
    margin-top: 8px;
    object-fit: contain;
}

/* 高亮代码 */
.markdown-content pre {
    background-color: #1E1E1E;
    border-radius: 4px;
    padding: 12px;
    overflow-x: auto;
    margin: 12px 0;
}

.markdown-content code {
    font-family: monospace;
}

/* markdown内容样式 */
.markdown-content {
    line-height: 1.6;
    font-size: 15px;
}

.markdown-content h1, 
.markdown-content h2, 
.markdown-content h3, 
.markdown-content h4, 
.markdown-content h5, 
.markdown-content h6 {
    margin-top: 16px;
    margin-bottom: 8px;
    font-weight: 600;
}

.markdown-content h1 { font-size: 1.8em; }
.markdown-content h2 { font-size: 1.5em; }
.markdown-content h3 { font-size: 1.3em; }
.markdown-content h4 { font-size: 1.2em; }

.markdown-content p {
    margin-bottom: 12px;
}

.markdown-content ul, 
.markdown-content ol {
    margin-left: 20px;
    margin-bottom: 12px;
}

.markdown-content li {
    margin-bottom: 4px;
}

.markdown-content blockquote {
    border-left: 4px solid #666;
    padding-left: 12px;
    color: #aaa;
    margin: 12px 0;
}

.markdown-content pre {
    margin: 12px 0;
}

.markdown-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
}

.markdown-content th,
.markdown-content td {
    border: 1px solid #444;
    padding: 8px;
}

.markdown-content th {
    background-color: #333;
}
</style>
<script>
// 在这里定义全局变量和函数

let chatHistory = [];
let currentConversationId = generateId();
let isDeepThinking = false;
let currentMode = 'chat'; // 默认使用普通聊天模式
let apiUrl = '/api_chat'; // API端点
let conversationsMap = {}; // 存储所有对话历史
let typingSpeed = 20; // 打字速度：每个字符的毫秒数
let isTyping = false; // 是否正在打字中
let isMenuOpen = false;
let lastMessageWasUser = false;
let chatMessagesContainer = null;

function generateId() {
  return 'conv_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
}

function createNewConversation() {
  console.log('创建新对话');
  
  // 清空聊天区域
  chatMessagesContainer.innerHTML = '';
  
  // 清空聊天历史
  chatHistory = [];
  
  // 重置当前对话ID
  currentConversationId = generateId();
  console.log(`新对话已创建，ID: ${currentConversationId}`);
  
  // 更新历史列表中的选中状态
  document.querySelectorAll('.history-item').forEach(item => {
    item.classList.remove('bg-gray-200', 'dark:bg-gray-700');
  });
  
  // 添加新对话到历史列表
  addConversationToHistory(
    '新对话',
    new Date().toLocaleString(),
    '无内容',
    currentConversationId
  );
  
  // 显示欢迎消息
  showWelcomeMessage();
}

function addConversationToHistory(title, time, preview, conversationId) {
  const historyContainer = document.getElementById('historyContainer');
  if (!historyContainer) {
    console.error('未找到历史容器元素');
    return;
  }
  
  // 检查对话是否已在列表中
  const existingItem = document.querySelector(`.history-item[data-id="${conversationId}"]`);
  if (existingItem) {
    console.log(`对话 ${conversationId} 已存在于历史列表中，更新其内容`);
    existingItem.querySelector('.history-title').textContent = title;
    existingItem.querySelector('.history-time').textContent = time;
    existingItem.querySelector('.history-preview').textContent = preview;
    return;
  }
  
  console.log(`添加对话到历史：${title}, ID: ${conversationId}`);
  
  // 检查是否为当前对话，添加选中状态
  const isCurrentConversation = currentConversationId === conversationId;
  const selectedClass = isCurrentConversation ? 'bg-gray-200 dark:bg-gray-700' : '';
  
  const historyItem = document.createElement('div');
  historyItem.className = `history-item p-3 border-b border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer transition duration-200 ${selectedClass}`;
  historyItem.setAttribute('data-id', conversationId);
  
  historyItem.innerHTML = `
    <div class="flex justify-between items-start">
      <div class="history-title font-medium text-gray-800 dark:text-gray-200 truncate max-w-[70%]">${escapeHTML(title)}</div>
      <div class="flex">
        <div class="history-time text-xs text-gray-500 dark:text-gray-400">${time}</div>
        <button class="delete-conversation-btn ml-2 text-white bg-gray-600 hover:bg-red-600 p-1 rounded-full transition-colors duration-200 focus:outline-none" title="删除对话">
          <i class="fas fa-trash-alt text-xs"></i>
        </button>
      </div>
    </div>
    <div class="history-preview text-sm text-gray-600 dark:text-gray-400 mt-1 truncate">${escapeHTML(preview || '无预览')}</div>
  `;
  
  // 添加点击事件
  historyItem.addEventListener('click', function(e) {
    // 如果点击的是删除按钮，不执行加载对话操作
    if (e.target.closest('.delete-conversation-btn')) {
      return;
    }
    loadConversation(conversationId);
  });
  
  // 添加删除按钮点击事件
  const deleteBtn = historyItem.querySelector('.delete-conversation-btn');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', function(e) {
      e.stopPropagation(); // 阻止冒泡，避免触发对话加载
      deleteConversation(conversationId);
    });
  }
  
  // 将对话项添加到历史容器顶部
  if (historyContainer.firstChild) {
    historyContainer.insertBefore(historyItem, historyContainer.firstChild);
  } else {
    historyContainer.appendChild(historyItem);
  }
  
  // 存储对话信息到内存中
  conversationsMap[conversationId] = {
    id: conversationId,
    title: title,
    time: time,
    preview: preview
  };
}

function sendMessage() {
  const userInput = document.getElementById('userInput');
  const message = userInput.value.trim();
  
  if (message === '') {
    showToast('警告', '请输入消息后再发送', 'warning');
    return;
  }
  
  // 清空输入框
  userInput.value = '';
  
  // 创建用户消息元素并添加到聊天区域
  createUserMessage(message, false);
  
  // 添加到聊天历史
  const userMessage = {
    role: 'user',
    content: message,
    timestamp: Date.now()
  };
  chatHistory.push(userMessage);
  
  // 滚动到底部
  scrollToBottom();
  
  // 显示AI正在输入指示器
  showTypingIndicator();
  
  // 发送消息到服务器
  fetch('/api_chat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: message,
      conversation_id: currentConversationId,
      mode: currentMode || 'chat'
    })
  })
  .then(response => {
    if (!response.ok) {
      throw new Error(`服务器响应错误: ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    console.log('聊天响应:', data);
    hideTypingIndicator();
    
    if (data.success) {
      // 构建AI回复对象
      const aiResponse = {
        role: 'assistant',
        content: data.response,
        timestamp: Date.now()
      };
      
      // 添加到聊天历史
      chatHistory.push(aiResponse);
      
      // 显示AI回复
      createAiMessage(data.response);
      
      // 如果是新对话，更新对话ID和对话历史列表
      if (data.conversation_id && data.conversation_id !== currentConversationId) {
        currentConversationId = data.conversation_id;
      }
      
      // 从用户消息中提取对话标题
      let title = message.length > 30 ? message.substring(0, 30) + '...' : message;
      
      // 更新或添加到历史列表
      addConversationToHistory(
        title,
        new Date().toLocaleString(),
        message,
        currentConversationId
      );
      
      // 保存到内存
      conversationsMap[currentConversationId] = {
        id: currentConversationId,
        title: title,
        time: new Date().toLocaleString(),
        preview: message,
        messages: [...chatHistory]
      };
      
      // 滚动到底部
      scrollToBottom();
    } else {
      console.error('服务器返回错误:', data.error);
      showToast('错误', `对话出错: ${data.error || '未知错误'}`, 'error');
      
      // 显示错误消息
      const errorMessage = `发生错误: ${data.error || '服务器处理请求时出错'}`;
      createAiMessage(errorMessage);
    }
  })
  .catch(error => {
    console.error('发送消息请求出错:', error);
    hideTypingIndicator();
    
    // 显示错误消息
    const errorMessage = `请求失败: ${error.message}。请检查您的网络连接或稍后重试。`;
    createAiMessage(errorMessage);
    
    showToast('错误', `发送消息失败: ${error.message}`, 'error');
  });
}

function addUserMessage(message, skipHistory = false) {
  const chatMessages = document.getElementById('chatMessages');
  const messageElement = document.createElement('div');
  messageElement.className = 'flex items-start gap-4 justify-end mb-6 user-message';
  messageElement.innerHTML = `
    <div class="flex-1 text-right">
      <div class="user-bubble p-4 rounded-lg max-w-[80%] ml-auto">
        ${message}
      </div>
      <div class="text-xs text-gray-500 mt-1">${new Date().toLocaleTimeString()}</div>
    </div>
  `;
  
  chatMessages.appendChild(messageElement);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  
  // 更新历史
  if (!skipHistory) {
    chatHistory.push({role: 'user', content: message});
  }
}

function addAIMessage(message, instant = false) {
  if (isTyping) {
    // 如果正在打字，先清除当前打字
    const typingElement = document.querySelector('.typing-message');
    if (typingElement) {
      typingElement.remove();
    }
  }
  
  const chatMessages = document.getElementById('chatMessages');
  const messageElement = document.createElement('div');
  messageElement.className = 'flex items-start gap-4 typing-message mb-6';
  
  // 创建初始内容
  messageElement.innerHTML = `
    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-600 to-blue-500 flex items-center justify-center font-bold shadow-lg">
      AI
    </div>
    <div class="flex-1">
      <div class="ai-bubble p-4 rounded-lg relative markdown-content">
        <div id="typing-content"></div>
        <button class="absolute bottom-4 right-4 bg-[#404040] hover:bg-[#505050] px-3 py-1.5 !rounded-button text-sm flex items-center gap-2 copy-button hover-effect" style="display:none" onclick="copyContent(this)">
          <i class="fas fa-copy"></i>
          复制内容
        </button>
      </div>
      <div class="text-xs text-gray-500 mt-1">${new Date().toLocaleTimeString()}</div>
    </div>
  `;
  
  chatMessages.appendChild(messageElement);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  
  const typingContent = messageElement.querySelector('#typing-content');
  const copyButton = messageElement.querySelector('.copy-button');
  
  // 如果需要立即显示（不需要打字效果）
  if (instant) {
    const renderedContent = marked.parse(message);
    typingContent.innerHTML = renderedContent;
    copyButton.style.display = 'flex';
    
    // 应用代码高亮
    messageElement.querySelectorAll('pre code').forEach((block) => {
      hljs.highlightElement(block);
    });
    
    // 更新历史
    chatHistory.push({role: 'assistant', content: message});
    return;
  }
  
  // 打字效果
  isTyping = true;
  let i = 0;
  const typeNextChar = () => {
    if (i < message.length) {
      // 每100个字符渲染一次Markdown，减少卡顿
      if (i % 100 === 0 || i === message.length - 1) {
        const currentText = message.substring(0, i + 1);
        const renderedContent = marked.parse(currentText);
        typingContent.innerHTML = renderedContent + '<span class="typing-cursor"></span>';
        
        // 尝试应用代码高亮
        messageElement.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      }
      
      i++;
      chatMessages.scrollTop = chatMessages.scrollHeight;
      
      // 根据内容长度动态调整速度
      const currentSpeed = message.length > 500 ? 5 : typingSpeed;
      setTimeout(typeNextChar, currentSpeed);
    } else {
      // 打字完成
      isTyping = false;
      copyButton.style.display = 'flex';
      
      // 最后一次完整渲染
      const renderedContent = marked.parse(message);
      typingContent.innerHTML = renderedContent;
      
      // 应用代码高亮
      messageElement.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
      
      // 更新历史
      chatHistory.push({role: 'assistant', content: message});
    }
  };
  
  typeNextChar();
}

function copyContent(button) {
  const contentElement = button.closest('.ai-bubble').querySelector('#typing-content');
  const textToCopy = contentElement.innerText;
  
  navigator.clipboard.writeText(textToCopy)
    .then(() => {
      const originalText = button.innerHTML;
      button.innerHTML = '<i class="fas fa-check"></i> 已复制';
      
      setTimeout(() => {
        button.innerHTML = originalText;
      }, 2000);
    })
    .catch(err => {
      console.error('复制失败:', err);
      showToast('复制失败', 'error');
    });
}

// 切换深度思考模式
function toggleDeepThinking() {
  console.log('切换深度思考模式');
  isDeepThinking = !isDeepThinking;
  
  // 更新按钮样式
  const deepThinkingButton = document.getElementById('deepThinkingButton');
  if (isDeepThinking) {
    deepThinkingButton.classList.add('deep-thinking-active');
    deepThinkingButton.classList.remove('bg-primary');
    showToast('提示', '已开启深度思考模式', 'info');
    
    // 更新全局变量
    currentMode = 'deepseek-r1';
    console.log('已切换到深度思考模式: deepseek-r1');
  } else {
    deepThinkingButton.classList.remove('deep-thinking-active');
    deepThinkingButton.classList.add('bg-primary');
    showToast('提示', '已关闭深度思考模式', 'info');
    
    // 恢复默认模式
    currentMode = 'chat';
    console.log('已恢复默认模式: chat');
  }
}

function uploadImage() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.click();
  
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      addUserImageMessage(event.target.result);
      
      sendImageToServer(file);
    };
    reader.readAsDataURL(file);
  };
}

function addUserImageMessage(imageUrl) {
  const chatMessages = document.getElementById('chatMessages');
  const messageElement = document.createElement('div');
  messageElement.className = 'flex items-start gap-4 justify-end mb-6 user-message';

    // 如果图片高度超过200px，按比例缩小

    let width = img.width;
    let height = img.height;
    
    if (height > maxHeight) {
      width = Math.floor(width * (maxHeight / height));
      height = maxHeight;
    }
    
    console.log(`调整后图片尺寸: ${width}x${height}`);
  };
  img.src = imageUrl;
  
  messageElement.innerHTML = `
    <div class="flex-1 text-right">

      </div>

  `;
  
  chatMessages.appendChild(messageElement);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  
  // 将图片消息添加到历史记录
  chatHistory.push({
    role: 'user', 
    content: '[上传图片]',
    image: imageUrl,
    timestamp: new Date().toISOString()
  });
}

// 发送图片到服务器
function sendImageToServer(file) {
  if (!file) {
    showToast('错误', '未选择图片文件', 'error');
    return;
  }
  
  // 检查文件类型
  const validImageTypes = ['image/jpeg', 'image/png', 'image/jpg', 'image/gif'];
  if (!validImageTypes.includes(file.type)) {
    console.error('不支持的图片格式:', file.type);
    showToast('错误', '不支持的图片格式。请使用JPG、JPEG、PNG或GIF格式的图片。', 'error');
    return;
  }
  
  // 检查文件大小 (最大4MB)
  const maxSize = 4 * 1024 * 1024; // 4MB
  if (file.size > maxSize) {
    console.error('图片太大:', (file.size / 1024 / 1024).toFixed(2) + 'MB');
    showToast('错误', `图片太大 (${(file.size / 1024 / 1024).toFixed(2)}MB)。最大允许4MB。`, 'error');
    return;
  }
  
  console.log('准备上传图片:', file.name, file.type, `${(file.size / 1024).toFixed(2)}KB`);
  
  // 在聊天区域添加用户图片消息占位符
  createUserMessage('[上传图片]', true, URL.createObjectURL(file));
  
  // 显示AI正在输入提示
  showTypingIndicator();
  
  // 创建FormData对象
  const formData = new FormData();
  formData.append('image', file);
  formData.append('conversation_id', currentConversationId || '');
  
  // 显示上传中提示
  showToast('信息', '正在上传图片并分析...', 'info');
  
  // 发送图片到服务器
  fetch('/api_image', {
    method: 'POST',
    body: formData,
    timeout: 60000 // 60秒超时
  })
  .then(response => {
    if (!response.ok) {
      throw new Error(`服务器响应错误: ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    console.log('图片上传响应:', data);
    hideTypingIndicator();
    
    if (data.success) {
      // 播放通知声音
      try {
        const audio = new Audio('/static/notification.mp3');
        audio.play().catch(e => console.log('无法播放通知声音:', e));
      } catch (e) {
        console.log('播放通知声音出错:', e);
      }
      
      // 构建用户图片消息对象
      const userImageMessage = {
        role: 'user',
        content: '[上传图片]',
        image: data.image_url,
        timestamp: Date.now()
      };
      
      // 构建AI回复对象
      const aiResponse = {
        role: 'assistant',
        content: data.response,
        timestamp: Date.now()
      };
      
      // 添加到聊天历史
      chatHistory.push(userImageMessage);
      chatHistory.push(aiResponse);
      
      // 显示AI回复
      createAiMessage(data.response);
      
      // 如果是新对话，更新对话ID
      if (data.conversation_id && data.conversation_id !== currentConversationId) {
        currentConversationId = data.conversation_id;
      }
      
      // 更新或添加到历史列表
      addConversationToHistory(
        '图片分析',
        new Date().toLocaleString(),
        '[图片分析]',
        currentConversationId
      );
      
      // 保存到内存
      conversationsMap[currentConversationId] = {
        id: currentConversationId,
        title: '图片分析',
        time: new Date().toLocaleString(),
        preview: '[图片分析]',
        messages: [...chatHistory]
      };
      
      // 滚动到底部
      scrollToBottom();
    } else {
      console.error('图片处理失败:', data.error);
      showToast('错误', `图片处理失败: ${data.error || '未知错误'}`, 'error');
      
      // 显示错误消息
      const errorMessage = `图片处理失败: ${data.error || '服务器处理请求时出错'}。请尝试使用不同的图片或稍后重试。`;
      createAiMessage(errorMessage);
    }
  })
  .catch(error => {
    console.error('图片上传请求出错:', error);
    hideTypingIndicator();
    
    // 显示错误消息
    const errorMessage = `图片上传失败: ${error.message}。请检查您的网络连接，确保图片格式正确，或稍后重试。如果问题持续存在，请尝试使用较小的图片或不同的图片格式。`;
    createAiMessage(errorMessage);
    
    showToast('错误', `图片上传失败: ${error.message}`, 'error');
  });
}

<script>
// 加载对话历史列表
function loadConversationHistory() {
  const historyContainer = document.getElementById('historyContainer');
  if (!historyContainer) {
    console.error('未找到历史容器元素');
    return;
  }
  
  console.log('加载对话历史列表...');
  
  // 显示加载状态
  historyContainer.innerHTML = '<div class="p-4 text-center text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>正在加载对话历史...</div>';
  
  // 从服务器加载对话历史列表
  fetch('/api_get_conversations')
    .then(response => {
      if (!response.ok) {
        throw new Error(`服务器响应错误: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      console.log('获取对话历史响应:', data);
      
      // 清空历史容器
      historyContainer.innerHTML = '';
      
      if (data.success && data.conversations && data.conversations.length > 0) {
        console.log('加载到', data.conversations.length, '个对话');
        
        // 按时间倒序排列
        data.conversations.sort((a, b) => {
          // 尝试解析日期，如果失败则使用字符串比较
          const dateA = a.last_updated || a.time || '';
          const dateB = b.last_updated || b.time || '';
          try {
            return new Date(dateB) - new Date(dateA);
          } catch (e) {
            return dateB.localeCompare(dateA);
          }
        });
        
        // 显示对话列表
        data.conversations.forEach(conv => {
          addConversationToHistory(
            conv.title || '新对话', 
            conv.last_updated || conv.time || new Date().toLocaleString(),
            conv.preview || '',
            conv.id
          );
        });
      } else {
        console.log('没有历史对话或加载失败');
        historyContainer.innerHTML = '<div class="p-4 text-center text-gray-400">没有历史对话</div>';
      }
    })
    .catch(error => {
      console.error('加载对话历史出错:', error);
      historyContainer.innerHTML = `<div class="p-4 text-center text-red-400">加载失败: ${error.message}</div>`;
    });
}

// 显示提示消息
function showToast(title, message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg ${type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-yellow-600' : type === 'success' ? 'bg-green-600' : 'bg-blue-600'} text-white z-50 animate-fadeIn transform transition-transform duration-300`;
  toast.innerHTML = `
    <div class="flex items-center">
      <div class="mr-3">
        ${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : 
          type === 'warning' ? '<i class="fas fa-exclamation-triangle"></i>' : 
          type === 'success' ? '<i class="fas fa-check-circle"></i>' : 
          '<i class="fas fa-info-circle"></i>'}
      </div>
      <div>
        <p class="font-bold">${title}</p>
        <p class="text-sm">${message}</p>
      </div>
    </div>
  `;
  document.body.appendChild(toast);
  
  // 动画效果
  setTimeout(() => {
    toast.classList.add('translate-y-2');
    setTimeout(() => {
      toast.classList.remove('translate-y-2');
      toast.classList.add('opacity-0', 'translate-y-[-8px]');
      setTimeout(() => {
        toast.remove();
      }, 300);
    }, 3000);
  }, 50);
}

// 复制消息内容
function copyMessageContent(button) {
  const messageContent = button.closest('.message-content').querySelector('.markdown-content');
  if (!messageContent) return;
  
  // 创建临时文本区域
  const textarea = document.createElement('textarea');
  textarea.value = messageContent.innerText;
  document.body.appendChild(textarea);
  
  // 选择并复制
  textarea.select();
  document.execCommand('copy');
  
  // 移除临时元素
  document.body.removeChild(textarea);
  
  // 显示提示
  showToast('成功', '内容已复制到剪贴板', 'success');
  
  // 修改按钮文本并还原
  const originalText = button.innerHTML;
  button.innerHTML = '<i class="fas fa-check"></i> 已复制';
  setTimeout(() => {
    button.innerHTML = originalText;
  }, 2000);
}

// 创建用户消息
function createUserMessage(content, hasImage = false, imageUrl = null, timestamp = null) {
  const userMessage = document.createElement('div');
  userMessage.className = 'message user-message';
  
  let messageContent = '';
  if (hasImage && imageUrl) {
    messageContent = `
      <div class="message-content">
        <div class="text-content">
          <p>${content}</p>
          <img src="${imageUrl}" alt="用户上传的图片" class="uploaded-image" 
               style="max-width: 300px; max-height: 300px; border-radius: 8px; margin-top: 8px;" />
        </div>
      </div>
    `;
  } else {
    messageContent = `
      <div class="message-content">
        <div class="text-content">
          <p>${escapeHTML(content)}</p>
        </div>
      </div>
    `;
  }
  
  userMessage.innerHTML = `
    ${messageContent}
    <div class="message-timestamp">${new Date(timestamp || Date.now()).toLocaleTimeString()}</div>
  `;
  
  chatMessagesContainer.appendChild(userMessage);
  scrollToBottom();
}

// 创建AI消息
function createAiMessage(content, timestamp = null) {
  try {
    // 使用marked解析markdown
    const formattedContent = marked.parse(content);
    
    const aiMessage = document.createElement('div');
    aiMessage.className = 'message ai-message';
    aiMessage.innerHTML = `
      <div class="ai-avatar">
        <img src="/static/LOGO.jpg" alt="AI" class="w-8 h-8 rounded-full object-cover shadow-lg">
      </div>
      <div class="message-content">
        <div class="markdown-content">${formattedContent}</div>
        <button class="copy-button" onclick="copyMessageContent(this)">
          <i class="fas fa-copy"></i> 复制
        </button>
      </div>
      <div class="message-timestamp">${new Date(timestamp || Date.now()).toLocaleTimeString()}</div>
    `;
    
    chatMessagesContainer.appendChild(aiMessage);
    
    // 应用代码高亮
    aiMessage.querySelectorAll('pre code').forEach((block) => {
      if (window.hljs) {
        hljs.highlightElement(block);
      }
    });
    
    // 滚动到底部
    scrollToBottom();
  } catch (error) {
    console.error("渲染AI消息时出错:", error);
    
    // 如果解析失败，显示原始文本
    const aiMessage = document.createElement('div');
    aiMessage.className = 'message ai-message';
    aiMessage.innerHTML = `
      <div class="ai-avatar">
        <img src="/static/LOGO.jpg" alt="AI" class="w-8 h-8 rounded-full object-cover shadow-lg">
      </div>
      <div class="message-content">
        <div class="markdown-content">
          <p>无法渲染消息内容</p>
          <pre>${escapeHTML(content)}</pre>
        </div>
        <button class="copy-button" onclick="copyMessageContent(this)">
          <i class="fas fa-copy"></i> 复制
        </button>
      </div>
      <div class="message-timestamp">${new Date(timestamp || Date.now()).toLocaleTimeString()}</div>
    `;
    
    chatMessagesContainer.appendChild(aiMessage);
    scrollToBottom();
  }
}

// HTML转义函数
function escapeHTML(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// 加载对话
function loadConversation(conversationId) {
  if (!conversationId) {
    console.error('未提供对话ID');
    showToast('错误', '无法加载对话：未提供对话ID', 'error');
    return;
  }
  
  console.log(`尝试加载对话: ${conversationId}`);
  
  // 高亮当前选中的对话
  document.querySelectorAll('.history-item').forEach(item => {
    item.classList.remove('bg-gray-200', 'dark:bg-gray-700');
    if (item.dataset.id === conversationId) {
      item.classList.add('bg-gray-200', 'dark:bg-gray-700');
    }
  });
  
  // 显示加载状态
  chatMessagesContainer.innerHTML = '<div class="p-4 text-center text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>正在加载对话...</div>';
  
  // 如果对话已在内存中
  if (conversationsMap[conversationId] && conversationsMap[conversationId].messages) {
    console.log('从内存中加载对话:', conversationId);
    
    // 设置当前对话ID
    currentConversationId = conversationId;
    
    // 恢复对话历史
    chatHistory = [...conversationsMap[conversationId].messages];
    
    // 更新显示
    updateChatDisplay();
    
    return;
  }
  
  // 从服务器加载对话
  console.log('从服务器加载对话:', conversationId);
  fetch(`/api_load_conversation?id=${encodeURIComponent(conversationId)}`)
    .then(response => {
      if (!response.ok) {
        throw new Error(`服务器响应错误: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      console.log('对话加载响应:', data);
      
      if (data.success) {
        // 设置当前对话ID
        currentConversationId = conversationId;
        
        // 处理不同格式的对话数据
        if (Array.isArray(data.conversation)) {
          chatHistory = [...data.conversation];
        } else if (data.conversation && data.conversation.messages && Array.isArray(data.conversation.messages)) {
          chatHistory = [...data.conversation.messages];
        } else if (data.messages && Array.isArray(data.messages)) {
          chatHistory = [...data.messages];
        } else {
          console.error('无法识别的对话数据格式:', data);
          chatHistory = [];
          showToast('错误', '对话数据格式不正确', 'error');
        }
        
        // 保存到内存中
        conversationsMap[conversationId] = {
          id: conversationId,
          title: data.title || '对话',
          time: data.last_updated || new Date().toLocaleString(),
          preview: data.preview || '',
          messages: [...chatHistory]
        };
        
        // 更新显示
        updateChatDisplay();
        
        showToast('成功', '对话加载成功', 'success');
      } else {
        console.error('加载对话失败:', data.error || '未知错误');
        chatMessagesContainer.innerHTML = '<div class="p-4 text-center text-red-400">加载对话失败</div>';
        showToast('错误', `加载对话失败: ${data.error || '未知错误'}`, 'error');
      }
    })
    .catch(error => {
      console.error('加载对话请求出错:', error);
      chatMessagesContainer.innerHTML = `<div class="p-4 text-center text-red-400">加载失败: ${error.message}</div>`;
      showToast('错误', `加载对话请求出错: ${error.message}`, 'error');
    });
}

// 更新聊天显示
function updateChatDisplay() {
  console.log('更新聊天显示，历史消息数量:', chatHistory.length);
  
  // 清空聊天区域
  chatMessagesContainer.innerHTML = '';
  
  if (chatHistory.length === 0) {
    chatMessagesContainer.innerHTML = '<div class="p-4 text-center text-gray-400">没有聊天记录</div>';
    return;
  }
  
  // 遍历消息并显示
  chatHistory.forEach(msg => {
    if (msg.role === 'user') {
      if (msg.image) {
        createUserMessage(msg.content || '[上传图片]', true, msg.image, msg.timestamp);
      } else {
        createUserMessage(msg.content, false, null, msg.timestamp);
      }
    } else if (msg.role === 'assistant') {
      createAiMessage(msg.content, msg.timestamp);
    }
  });
  
  // 滚动到底部
  scrollToBottom();
}

// 删除对话
function deleteConversation(conversationId) {
  if (!conversationId) {
    showToast('错误', '无法删除对话：未提供对话ID', 'error');
    return;
  }
  
  console.log(`尝试删除对话: ${conversationId}`);
  
  // 确认删除
  if (!confirm('确定要删除此对话吗？此操作不可恢复。')) {
    return;
  }
  
  // 显示正在删除的提示
  showToast('提示', '正在删除对话...', 'info');
  
  // 发送删除请求到服务器
  fetch(`/api_delete_conversation?id=${encodeURIComponent(conversationId)}`, {
    method: 'DELETE'
  })
  .then(response => {
    if (!response.ok) {
      throw new Error(`服务器响应错误: ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    console.log('删除对话响应:', data);
    
    if (data.success) {
      // 从DOM中移除对话项
      const historyItem = document.querySelector(`.history-item[data-id="${conversationId}"]`);
      if (historyItem) {
        historyItem.remove();
      } else {
        console.warn(`未找到要删除的对话项: ${conversationId}`);
      }
      
      // 从内存中移除
      if (conversationsMap[conversationId]) {
        delete conversationsMap[conversationId];
      }
      
      showToast('成功', '对话已删除', 'success');
      
      // 如果删除的是当前对话，创建新对话
      if (conversationId === currentConversationId) {
        createNewConversation();
      }
    } else {
      console.error('服务器删除对话失败:', data.error || '未知错误');
      showToast('错误', `删除对话失败: ${data.error || '未知错误'}`, 'error');
    }
  })
  .catch(error => {
    console.error('删除对话请求出错:', error);
    showToast('错误', `删除对话请求出错: ${error.message}`, 'error');
    
    // 尝试在前端删除（如果后端失败但我们仍希望UI保持一致）
    try {
      // 从DOM中移除对话项
      const historyItem = document.querySelector(`.history-item[data-id="${conversationId}"]`);
      if (historyItem) {
        historyItem.remove();
      }
      
      // 从内存中移除
      if (conversationsMap[conversationId]) {
        delete conversationsMap[conversationId];
      }
      
      // 如果删除的是当前对话，创建新对话
      if (conversationId === currentConversationId) {
        createNewConversation();
      }
    } catch (e) {
      console.error('前端删除对话失败:', e);
    }
  });
}
</script>
